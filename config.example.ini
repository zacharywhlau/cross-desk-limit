# cross-desk-limit - copy this file to config.ini and edit it there.
# config.ini is gitignored: no environment specific value ever gets committed.
#
# DO NOT PUT QUOTES AROUND A VALUE. This is an ini file, not Python: everything after
# the "=" is the value, so
#     url = "http://host/path"     -> the value includes the two quote characters
#     url = http://host/path       -> correct
# Quotes are stripped if you leave them and `doctor` reports the keys involved, but the
# file should not have them. The CONFIG block of prototype/check_limit.py is the
# opposite case: it is Python, so the quotes there are required.
#
# Any value may be overridden by an environment variable, e.g. CDL_STORE_DB_PATH.

[treats]
url = PASTE_ENDPOINT_URL_HERE
library = PASTE_LIBRARY_NAME_HERE
ttcpipp = mock
cksblmp = mock
ckovlmp = mock
# The endpoint caps a result set. A read that comes back with exactly this many rows is
# treated as truncated, and the check reports ERROR rather than deciding on partial data.
max_rows = 20000
# A counterparty `doctor` may query to prove each api table answers, instead of reading
# a whole table. Leave it empty to probe with a small row-bounded sample instead.
probe_counterparty =

[ffr]
source = mock            # target is api; excel is last resort
table = CKBLOTP          # FFR table; column layout still being confirmed
weight_column = 2025Q2   # which quarterly snapshot column to read (see docs/PLAN.md §7)
excel_path =

[store]
db_path = ./data/cross_desk_limit.db
hold_ttl_minutes = 60
busy_timeout_ms = 15000
# auto detects a UNC path (\\server\share) and then uses the rollback journal
# instead of WAL, which is unsafe over SMB. Force it with true or false.
network_path = auto

[paths]
dev_cache = ./dev_cache
mock_treats = ./data/mock_treats
